services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - PORT=3000
      # migrate:run does `env $(cat ${ENV_FILE:-.env}) ...`; there is no .env file
      # in the container, so point it at /dev/null and rely on the process env
      # (already populated by env_file/environment above) instead.
      - ENV_FILE=/dev/null
    depends_on:
      - db
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:17.4-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` mapping on purpose: Postgres is only reachable inside this
    # compose network as `db:5432`, never exposed on the host/firewall.

volumes:
  pgdata:
  caddy_data:
  caddy_config:
