name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync app code to the instance
        run: |
          rsync -avz \
            --exclude '.git' \
            --exclude 'infra/terraform' \
            --exclude '.env.prod' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "ubuntu@${{ secrets.LIGHTSAIL_HOST }}:/home/ubuntu/tennis_directory/"

      - name: Build, migrate, reload
        run: |
          ssh -i ~/.ssh/deploy_key "ubuntu@${{ secrets.LIGHTSAIL_HOST }}" '
            set -e
            cd tennis_directory
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T app yarn migrate:run
            docker compose -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          '
